<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StageCue Audio</title>
    <link rel="stylesheet" href="./controller.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <input id="projectTitle" class="title-input" value="新しいイベント">
          <div class="subtitle">曲順再生 / ステージ別リスト / Mac版</div>
        </div>
        <div class="top-actions">
          <button id="openProjectBtn">開く</button>
          <button id="saveProjectBtn">保存</button>
          <button id="addStageBtn">ステージ追加</button>
          <button id="addAudioBtn" class="primary">曲を追加</button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel stage-panel">
          <div class="panel-head">
            <h2>ステージ</h2>
          </div>
          <div id="stageList" class="stage-list"></div>
        </section>

        <section class="panel cue-panel">
          <div class="panel-head">
            <h2 id="currentStageName">第1部</h2>
            <div class="cue-actions">
              <button id="moveUpBtn">上へ</button>
              <button id="moveDownBtn">下へ</button>
              <button id="deleteCueBtn" class="danger">削除</button>
            </div>
          </div>
          <div id="dropZone" class="drop-zone">音声ファイルをここにドラッグできます</div>
          <div id="cueList" class="cue-list"></div>
        </section>

        <section class="panel detail-panel">
          <div class="panel-head">
            <h2>曲の設定</h2>
          </div>
          <div id="emptyDetail" class="empty-detail">曲を選択してください。</div>
          <form id="cueForm" class="cue-form hidden">
            <label>表示名<input id="cueName" type="text"></label>
            <label>開始位置 秒<input id="startTime" type="number" min="0" step="0.1"></label>
            <label>終了位置 秒<input id="endTime" type="number" min="0" step="0.1" placeholder="空欄なら最後まで"></label>
            <label>音量 %<input id="volume" type="number" min="0" max="100" step="1"></label>
            <label>ゲイン dB<input id="gainDb" type="number" min="-24" max="12" step="0.5"></label>
            <label>フェードイン 秒<input id="fadeIn" type="number" min="0" step="0.1"></label>
            <label>フェードアウト 秒<input id="fadeOut" type="number" min="0" step="0.1"></label>
            <label class="checkbox"><input id="loop" type="checkbox"> くり返し再生</label>
            <label>終了後
              <select id="afterAction">
                <option value="wait">待機する</option>
                <option value="next">次へ進む</option>
              </select>
            </label>
            <label>メモ<textarea id="memo" rows="5"></textarea></label>
          </form>
        </section>
      </main>

      <footer class="transport">
        <div class="now">
          <div class="label">今鳴っている曲</div>
          <div id="nowPlaying" class="now-title">未再生</div>
          <div id="timeStatus" class="time-status">00:00 / 00:00</div>
        </div>
        <div class="transport-buttons">
          <button id="goBtn" class="go">GO</button>
          <button id="pauseBtn">一時停止</button>
          <button id="resumeBtn">再開</button>
          <button id="stopBtn">停止</button>
          <button id="fadeStopBtn">フェードアウト停止</button>
        </div>
        <div class="next">
          <div class="label">次に再生</div>
          <div id="nextCue" class="next-title">なし</div>
        </div>
      </footer>
    </div>
    <audio id="audioPlayer"></audio>
    <script src="./controller.js"></script>
  </body>
</html>
